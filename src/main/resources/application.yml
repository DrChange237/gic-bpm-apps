spring:
  application:
    name: PAPERLESS-SERVICE

  jpa:
    hibernate:
      ddl-auto: update
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate.default_schema: public



security:
  oauth2:
    resource:
      user-info-uri: http://localhost:9100/api/user

    client:
      client-id: trusted-app
      client-secret: XY7kmzoNzl100
      grant-type: client_credentials
      access-token-uri: http://localhost:9100/api/oauth/token

feign:
  httpclient:
    max-connections: 10
    max-connections-per-route: 8
    connection-timeout: 60000
  client:
    config:
      default:
        read-timeout : 60000
        connectTimeout: 60000






